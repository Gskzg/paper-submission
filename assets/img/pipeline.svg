<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="Placeholder method overview diagram with five stages">
  <defs>
    <linearGradient id="boxBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e8edf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#9aa6bb"/>
    </marker>
  </defs>

  <rect width="1600" height="700" fill="#ffffff"/>

  <text x="800" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#2b3038">Method overview (placeholder)</text>
  <text x="800" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8b93a3">Replace assets/img/pipeline.svg with your own pipeline figure</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- stage boxes -->
    <g>
      <rect x="60" y="240" width="260" height="230" rx="16" fill="url(#boxBg)" stroke="#cdd6e4" stroke-width="2"/>
      <circle cx="190" cy="312" r="26" fill="#b9c6da"/>
      <text x="190" y="384" text-anchor="middle" font-size="25" fill="#2b3038">Reference</text>
      <text x="190" y="418" text-anchor="middle" font-size="18" fill="#7d8697">single input image</text>
    </g>
    <line x1="322" y1="355" x2="362" y2="355" stroke="#9aa6bb" stroke-width="4" marker-end="url(#arrow)"/>

    <g>
      <rect x="365" y="240" width="260" height="230" rx="16" fill="url(#boxBg)" stroke="#cdd6e4" stroke-width="2"/>
      <rect x="465" y="286" width="60" height="52" rx="6" fill="#b9c6da"/>
      <text x="495" y="384" text-anchor="middle" font-size="25" fill="#2b3038">Parsing</text>
      <text x="495" y="418" text-anchor="middle" font-size="18" fill="#7d8697">objects and relations</text>
    </g>
    <line x1="627" y1="355" x2="667" y2="355" stroke="#9aa6bb" stroke-width="4" marker-end="url(#arrow)"/>

    <g>
      <rect x="670" y="240" width="260" height="230" rx="16" fill="url(#boxBg)" stroke="#cdd6e4" stroke-width="2"/>
      <path d="M 770 292 l 22 12 v 24 l -22 12 l -22 -12 v -24 z" fill="#b9c6da"/>
      <text x="800" y="384" text-anchor="middle" font-size="25" fill="#2b3038">Construction</text>
      <text x="800" y="418" text-anchor="middle" font-size="18" fill="#7d8697">parametric builders</text>
    </g>
    <line x1="932" y1="355" x2="972" y2="355" stroke="#9aa6bb" stroke-width="4" marker-end="url(#arrow)"/>

    <g>
      <rect x="975" y="240" width="260" height="230" rx="16" fill="url(#boxBg)" stroke="#cdd6e4" stroke-width="2"/>
      <path d="M 1088 312 l 16 16 l 30 -34" fill="none" stroke="#b9c6da" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1105" y="384" text-anchor="middle" font-size="25" fill="#2b3038">Verify &amp; repair</text>
      <text x="1105" y="418" text-anchor="middle" font-size="18" fill="#7d8697">multi-view check</text>
    </g>
    <line x1="1237" y1="355" x2="1277" y2="355" stroke="#9aa6bb" stroke-width="4" marker-end="url(#arrow)"/>

    <g>
      <rect x="1280" y="240" width="260" height="230" rx="16" fill="#eef2fe" stroke="#2f5bd7" stroke-width="3"/>
      <rect x="1372" y="288" width="76" height="48" rx="5" fill="#8fa8ee"/>
      <text x="1410" y="384" text-anchor="middle" font-size="25" font-weight="bold" fill="#1d43ad">Final scene</text>
      <text x="1410" y="418" text-anchor="middle" font-size="18" fill="#5b6b9b">editable output</text>
    </g>
  </g>

  <text x="800" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#8b93a3">Edit the stage names in assets/img/pipeline.svg, or replace the file with your own diagram.</text>
</svg>
